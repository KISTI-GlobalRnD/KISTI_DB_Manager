[package]
name = "kisti_json_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "kisti_json_rs"
crate-type = ["cdylib"]

[dependencies]
arrow = "54"
mysql = { version = "25", default-features = false, features = ["minimal-rust"] }
parquet = { version = "54", features = ["arrow"] }
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"] }
rayon = "1.10"
serde_json = "1.0"
