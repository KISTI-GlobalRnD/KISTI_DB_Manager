[package]
name = "kisti_json_rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
simd-json = ["dep:simd-json"]

[lib]
name = "kisti_json_rs"
crate-type = ["cdylib"]

[dependencies]
arrow = "54"
mysql = { version = "25", default-features = false, features = ["minimal-rust"] }
parquet = { version = "54", features = ["arrow"] }
pyo3 = { version = "0.22", features = ["abi3-py310"] }
rayon = "1.10"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
simd-json = { version = "0.17", optional = true }
