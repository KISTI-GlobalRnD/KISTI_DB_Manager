site_name: KISTI_DB_Manager Docs
site_description: MariaDB/MySQL ingest, flattening, parquet, and review documentation
site_url: https://kisti-globalrnd.github.io/KISTI_DB_Manager/
repo_url: https://github.com/KISTI-GlobalRnD/KISTI_DB_Manager
repo_name: KISTI-GlobalRnD/KISTI_DB_Manager

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search

not_in_nav: |
  manual/*.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
  - Operator Guides:
      - Overview: operator-guides/index.md
      - OpenAlex Runbook: operator-guides/openalex-runbook.md
      - Parquet-First Workflow: operator-guides/parquet-first-workflow.md
      - Restart and Recovery: operator-guides/restart-recovery.md
      - Troubleshooting: operator-guides/troubleshooting.md
      - Release Checklist: operator-guides/release-checklist.md
  - Reference:
      - Reference Overview: reference/index.md
      - CLI Quick Reference: reference/cli.md
      - CLI and Script Boundaries: reference/script-boundaries.md
      - JSON Modes: reference/modes.md
      - Artifacts Reference: reference/artifacts.md
      - Examples: reference/examples.md
      - Overton Validation Queries: reference/overton-validation.md
  - Architecture:
      - Architecture Overview: architecture/index.md
      - Package Layout: architecture/package-layout.md
      - JSON Pipeline: architecture/json-pipeline.md
      - Rust Backend and Profiling: architecture/rust-backend.md
      - Review and Visualization: architecture/review-visualization.md
  - Korean Runbooks:
      - 한국어 운영 문서: ko/index.md
      - OpenAlex 운영 절차: ko/openalex-runbook.md
      - 재시작 및 복구: ko/recovery.md
      - 릴리스 체크리스트: ko/release-checklist.md
  - Decisions:
      - Decisions Overview: decisions/index.md
      - ADR 0001 Docs Source of Truth: decisions/adr-0001-docs-source-of-truth.md
  - Design and Performance:
      - Design Notes Overview: design/index.md
      - Description Profile v2: design/description-profile-v2.md
      - Scenario-Based Parquet Jobs: design/parquet_job_scenarios.md
      - 2026-02-09 Historical Ingest Tuning: performance/2026-02-09_ingest_tuning.md
      - 2026-02-27 Historical Schema Display Benchmark: performance/2026-02-27_schema-display-benchmark_from_02-goldset.md
      - 2026-03-31 Historical Parquet Materializer Plan: performance/2026-03-31_parquet_materializer_plan.md
