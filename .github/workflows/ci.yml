name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      db-smoke:
        description: Run optional MariaDB Rust DB smoke
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tabular,json,db,viz,review,docs,rust,test]"

      - name: Run unit tests
        run: pytest -q

      - name: Build documentation
        run: mkdocs build --strict

  rust:
    name: rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path crates/kisti_json_rs/Cargo.toml --check

      - name: Check crate
        run: cargo check --manifest-path crates/kisti_json_rs/Cargo.toml

      - name: Run crate tests
        run: cargo test --manifest-path crates/kisti_json_rs/Cargo.toml --no-default-features

      - name: Check crate with simd-json
        run: cargo check --manifest-path crates/kisti_json_rs/Cargo.toml --features simd-json

      - name: Run crate tests with simd-json
        run: cargo test --manifest-path crates/kisti_json_rs/Cargo.toml --no-default-features --features simd-json

  rust-extension:
    name: rust-extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install package, Rust build, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[json,rust,test]"

      - name: Build Python Rust extension
        run: python -m maturin develop --manifest-path crates/kisti_json_rs/Cargo.toml --release

      - name: Run Rust extension smoke
        run: pytest tests/test_rust_arrow_extension_smoke.py -q

  package:
    name: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: python -m build --sdist --wheel

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/kisti-wheel-smoke
          . /tmp/kisti-wheel-smoke/bin/activate
          WHEEL="$(ls dist/kisti_db_manager-*.whl)"
          python -m pip install --upgrade pip
          python -m pip install "$WHEEL"
          kisti-db-manager version
          kisti-db-manager --help

  db-smoke:
    name: optional-mariadb-rust-smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['db-smoke'] }}
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: kisti_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install package and Rust backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[json,db,rust]"
          python -m maturin develop --manifest-path crates/kisti_json_rs/Cargo.toml --release

      - name: Run Rust DB smoke
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          KISTI_SMOKE_DB_HOST: 127.0.0.1
          KISTI_SMOKE_DB_PORT: 3306
          KISTI_SMOKE_DB_NAME: kisti_smoke
        run: |
          kisti-db-manager smoke rust-db-load \
            --database kisti_smoke \
            --records 4 \
            --chunk-size 2
